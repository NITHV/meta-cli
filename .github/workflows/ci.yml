name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: CLI tests
        run: npm test
      - name: Desktop app syntax check
        working-directory: app
        shell: bash
        run: for f in main.js preload.js hook.js lib/*.js; do node --check "$f"; done
