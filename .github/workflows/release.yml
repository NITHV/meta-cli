# Builds the Tando installer on a Windows runner and attaches it to a GitHub release.
# Run it by pushing a tag (git tag v0.2.0; git push origin v0.2.0) or from the Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['app/**', '.github/workflows/release.yml']  # prove the installer still builds
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build installer
        working-directory: app
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Tando-Setup
          path: app/dist/Tando-Setup-*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/Tando-Setup-*.exe
          generate_release_notes: true
